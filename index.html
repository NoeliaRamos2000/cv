<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noelia Milagros Ramos Ramirez</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,500;0,9..144,700;1,9..144,500&family=Karla:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      :root {
        --rosa: #e43d7a;
        --rosa-2: #f7b3c8;
        --rosa-3: #ffe4ee;
        --naranja: #f17a3a;
        --tinta: #3a1730;
        --suave: #7a4a62;
        --papel: #fff7fa;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        min-height: 100dvh;
        background:
          radial-gradient(circle at 12% 18%, #ffc1d4 0 18px, transparent 19px),
          radial-gradient(circle at 88% 8%, #ffb07a 0 12px, transparent 13px),
          radial-gradient(circle at 78% 92%, #f7b3c8 0 22px, transparent 23px),
          radial-gradient(circle at 8% 86%, #ffd0a8 0 10px, transparent 11px),
          linear-gradient(165deg, #ffd6e4 0%, var(--papel) 42%, #ffe8d4 100%);
        color: var(--tinta);
        font-family: Karla, system-ui, sans-serif;
        line-height: 1.5;
      }

      main {
        max-width: 42rem;
        margin: 0 auto;
        padding: 2.25rem 1.15rem 3.5rem;
      }

      .tarjeta {
        background: #fff;
        border: 3px solid var(--tinta);
        border-radius: 2rem;
        box-shadow: 10px 12px 0 var(--rosa);
        overflow: hidden;
      }

      .hero {
        display: grid;
        gap: 1.4rem;
        padding: 1.6rem 1.4rem 1.5rem;
        background:
          radial-gradient(circle at 90% 20%, rgba(241, 122, 58, 0.28), transparent 32%),
          linear-gradient(135deg, #ff4f8b 0%, #e43d7a 55%, #f17a3a 140%);
        color: #fff;
      }

      .hero img {
        width: 8.5rem;
        height: 8.5rem;
        object-fit: cover;
        object-position: 50% 18%;
        border-radius: 1.35rem;
        border: 4px solid #fff;
        box-shadow: 6px 6px 0 rgba(58, 23, 48, 0.28);
        transform: rotate(-3deg);
      }

      h1 {
        margin: 0;
        font-family: Fraunces, Georgia, serif;
        font-size: clamp(2.1rem, 8vw, 3.15rem);
        font-weight: 700;
        line-height: 0.95;
        letter-spacing: -0.03em;
      }

      h1 em {
        display: block;
        font-style: italic;
        font-weight: 500;
        font-size: 0.72em;
      }

      .cinta {
        display: inline-block;
        margin-top: 0.85rem;
        padding: 0.28rem 0.7rem;
        border-radius: 999px;
        background: #fff;
        color: var(--rosa);
        font-size: 0.72rem;
        font-weight: 700;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .cuerpo {
        padding: 1.5rem 1.4rem 1.7rem;
      }

      section + section {
        margin-top: 1.6rem;
      }

      h2 {
        margin: 0 0 0.7rem;
        font-family: Fraunces, Georgia, serif;
        font-size: 1.35rem;
        font-weight: 700;
      }

      h2 span {
        color: var(--naranja);
      }

      .estudio {
        padding: 1rem 1.05rem;
        border-radius: 1.1rem;
        background: var(--rosa-3);
        border-left: 6px solid var(--rosa);
      }

      .estudio strong {
        display: block;
        font-size: 1.08rem;
      }

      .estudio span {
        color: var(--suave);
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
        display: grid;
        gap: 0.65rem;
      }

      li {
        display: grid;
        grid-template-columns: 7.2rem 1fr;
        gap: 0.8rem;
        align-items: center;
        padding: 0.85rem 0.95rem;
        border-radius: 1rem;
        background: #fff6f9;
        border: 1.5px solid #f3c4d4;
      }

      li:first-child {
        background: #fff1e6;
        border-color: #f5c19a;
      }

      .anio {
        font-size: 0.8rem;
        font-weight: 700;
        letter-spacing: 0.04em;
        color: var(--rosa);
      }

      li:first-child .anio {
        color: var(--naranja);
      }

      .idioma {
        display: flex;
        flex-wrap: wrap;
        align-items: center;
        gap: 0.65rem 0.85rem;
        padding: 0.95rem 1.05rem;
        border-radius: 1.1rem;
        background: #fff1e6;
        border: 1.5px dashed var(--naranja);
      }

      .chip {
        padding: 0.25rem 0.7rem;
        border-radius: 999px;
        background: var(--naranja);
        color: #fff;
        font-size: 0.78rem;
        font-weight: 700;
      }

      @media (min-width: 640px) {
        main {
          padding: 3.25rem 1.5rem 4rem;
        }

        .hero {
          grid-template-columns: auto 1fr;
          align-items: center;
          padding: 1.9rem 2rem;
        }

        .cuerpo {
          padding: 1.85rem 2rem 2.1rem;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="tarjeta">
        <header class="hero">
          <img src="./foto.jpg" alt="Noelia Milagros Ramos Ramirez" width="272" height="272" />
          <div>
            <h1>Noelia <em>Milagros Ramos Ramirez</em></h1>
            <p class="cinta">Administración y Marketing</p>
          </div>
        </header>

        <div class="cuerpo">
          <section>
            <h2>Estudios</h2>
            <p class="estudio">
              <strong>Administración y Marketing</strong>
              <span>Universidad Católica San Pablo</span>
            </p>
          </section>

          <section>
            <h2>Experiencia <span>.</span></h2>
            <ul>
              <li>
                <span class="anio">2022–2025</span>
                <span>Asistente administrativa</span>
              </li>
              <li>
                <span class="anio">2021</span>
                <span>Ventas, Grupo Noral</span>
              </li>
              <li>
                <span class="anio">2020</span>
                <span>Congreso</span>
              </li>
              <li>
                <span class="anio">2018–2019</span>
                <span>Atención al cliente</span>
              </li>
            </ul>
          </section>

          <section>
            <h2>Idiomas</h2>
            <p class="idioma">
              <span class="chip">B1</span>
              Inglés. En estudio.
            </p>
          </section>
        </div>
      </article>
    </main>
  </body>
</html>
