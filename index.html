<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Noelia Milagros Ramos Ramirez</title>
    <style>
      :root {
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f4f1ea;
        color: #1c1917;
        font-family: Georgia, "Times New Roman", serif;
        line-height: 1.5;
      }

      main {
        max-width: 40rem;
        margin: 0 auto;
        padding: 3.5rem 1.5rem 4rem;
      }

      header {
        display: flex;
        align-items: center;
        gap: 1.25rem;
      }

      header img {
        width: 5.5rem;
        height: 5.5rem;
        object-fit: cover;
        object-position: 50% 20%;
        border-radius: 50%;
        flex-shrink: 0;
      }

      h1 {
        margin: 0;
        font-size: 2rem;
        font-weight: 400;
        letter-spacing: -0.02em;
        line-height: 1.2;
      }

      h2 {
        margin: 2.25rem 0 0.75rem;
        font-family: system-ui, sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: #57534e;
      }

      p {
        margin: 0;
      }

      .estudio {
        font-size: 1.05rem;
      }

      .estudio span {
        display: block;
        margin-top: 0.2rem;
        color: #44403c;
      }

      ul {
        margin: 0;
        padding: 0;
        list-style: none;
      }

      li {
        display: grid;
        grid-template-columns: 7.5rem 1fr;
        gap: 1rem;
        padding: 0.7rem 0;
        border-top: 1px solid #d6d3d1;
      }

      li:last-child {
        border-bottom: 1px solid #d6d3d1;
      }

      .anio {
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        color: #57534e;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <img src="./foto.jpg" alt="Noelia Milagros Ramos Ramirez" width="176" height="176" />
        <h1>Noelia Milagros Ramos Ramirez</h1>
      </header>

      <h2>Estudios</h2>
      <p class="estudio">
        Administración y Marketing
        <span>Universidad Católica San Pablo</span>
      </p>

      <h2>Experiencia</h2>
      <ul>
        <li>
          <span class="anio">2022–2025</span>
          <span>Asistente administrativa</span>
        </li>
        <li>
          <span class="anio">2021</span>
          <span>Ventas, Grupo Noral</span>
        </li>
        <li>
          <span class="anio">2020</span>
          <span>Congreso</span>
        </li>
        <li>
          <span class="anio">2018–2019</span>
          <span>Atención al cliente</span>
        </li>
      </ul>

      <h2>Idiomas</h2>
      <p>Inglés, nivel B1. En estudio.</p>
    </main>
  </body>
</html>
